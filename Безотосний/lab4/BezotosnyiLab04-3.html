<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Вертикальні рядки</title>
  <meta name="description" content="Лабораторна робота №4">
  <meta name="keywords" content="HTML, marquee">
</head>

<body bgcolor="#222222" text="#FFFFFF">
  <table align="center">
    <tr>
      <td>
        <marquee direction="up" behavior="alternate" height="200" bgcolor="#555555">
          <p align="center">
            прів
            <br><br>
            я
            <br><br>
            єгор
          </p>
        </marquee>
      </td>
      <td>
        <marquee direction="up" behavior="scroll" height="200" bgcolor="#777777">
          <p align="center">
            <img src="image/1.jpg" width="100">
            <br>
            <img src="image/2.jpg" width="100">
          </p>
        </marquee>
      </td>
      <td>
        <marquee direction="down" behavior="slide" height="200" bgcolor="#999999">
          <p align="center">
            <img src="image/gym.jpg" width="100">
          </p>
        </marquee>
      </td>
      <td>
        <marquee direction="up" scrolldelay="50" height="200" bgcolor="#BBBBBB">
          <p align="center">
            чут бістрєє
          </p>
        </marquee>
      </td>
      <td>
        <marquee direction="down" scrolldelay="200" height="200" bgcolor="#DDDDDD">
          <p align="center">
            мєдлено
          </p>
        </marquee>
      </td>
    </tr>
  </table>
</body>

</html>
