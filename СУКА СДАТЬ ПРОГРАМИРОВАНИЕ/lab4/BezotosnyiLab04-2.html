<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Рядки що біжать</title>
  <meta name="description" content="Лабораторна робота №4">
  <meta name="keywords" content="HTML, marquee">
</head>

<body bgcolor="#111111" text="#FFFFFF">
  <br><br>
  <marquee behavior="alternate" bgcolor="#444444" height="50">
    <font color="white" size="5">
      я
    </font>
  </marquee>
  <br>
  <marquee direction="left" behavior="scroll" bgcolor="#666666" height="50">
    <font color="black" size="5">
      крутой
    </font>
  </marquee>
  <br>
  <marquee direction="right" behavior="slide" bgcolor="#999999" height="50">
    <font color="black" size="5">
      чоткій
    </font>
  </marquee>
  <br>
  <marquee scrolldelay="50" bgcolor="#BBBBBB" height="50">
    <font color="black" size="5">
      пацанчік
    </font>
  </marquee>
  <br>
  <marquee scrolldelay="200" bgcolor="#DDDDDD" height="50">
    <font color="black" size="5">
      чесно
    </font>
  </marquee>
</body>

</html>
